name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Python (lint + types + pytest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy .
      - run: pytest --cov-fail-under=90

  security:
    name: Dependency + secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Known-CVE scan of exactly what ships to production - dev-only
      # tooling (pytest, mypy, ...) is deliberately not included here,
      # same reasoning requirements-dev.txt itself gives for layering on
      # top of requirements.txt rather than replacing it.
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
      # Runs gitleaks' CLI directly via its official image, not the
      # gitleaks-action wrapper - that wrapper requires a paid
      # GITLEAKS_LICENSE for any org-owned repo beyond the first, which
      # would silently fail this job for anyone forking/hosting this
      # under an org. --no-git scans the checked-out working tree
      # (deterministic regardless of checkout fetch-depth) rather than
      # walking full git history. --redact keeps a real match's secret
      # value out of the job log even when it fails the build.
      - name: Scan for committed secrets (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo \
            --config /repo/.gitleaks.toml --no-git -v --redact

  docker:
    name: Build + publish Docker image
    needs: [backend, security]
    # push only, not pull_request - PRs from forks don't have access to
    # the registry secrets below, and we don't want to publish untested
    # images off an unmerged branch anyway.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Requires DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets
      # (Settings > Secrets and variables > Actions). DOCKERHUB_TOKEN
      # should be a Docker Hub access token, not your account password.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
