# Fully-resolved dependency set, including transitives. This is what the
# Dockerfile installs, so that two builds a week apart produce the same
# image rather than silently picking up whatever was newest that day.
#
# Pinning direct dependencies alone is not enough here. Werkzeug is a
# transitive of Flask and it is what hashes passwords
# (auth_db.generate_password_hash), so an unpinned upgrade could change
# the stored hash format underneath an existing auth.db.
#
# Regenerate with `pip freeze` in a clean Python 3.12 environment after
# changing requirements.txt. Do not hand-edit.
